apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kirtus
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      # bene1310/kirtus-web is PUBLIC - no pull secret needed.
      containers:
        - name: web
          image: bene1310/kirtus-web:1.0.0
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 192Mi }
