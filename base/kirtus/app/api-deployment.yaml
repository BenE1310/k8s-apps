apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kirtus
spec:
  # Two, so a config change, an image update or a lost node is not an outage.
  # Safe to run in parallel: startSmsScheduler() claims a campaign atomically
  # (scheduled -> sending), so no SMS goes out twice. The one thing that does not
  # scale cleanly is the rate limiter - it is in-memory and per-pod, so the
  # effective limit is doubled. Already true today, since the Windows instance
  # runs alongside this one.
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # Both replicas on one node survives a crash but not a lost node.
      # Preferred, not required, so a one-node cluster still schedules both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: api }
      # bene1310/kirtus-api is a PRIVATE Docker Hub repo - without this the pod
      # fails with ImagePullBackOff.
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: api
          image: bene1310/kirtus-api:1.0.0
          ports:
            - containerPort: 5175
          # ORDER MATTERS - the last source wins. Secret first (everything from
          # server/.env), ConfigMap second so the lab values override it.
          envFrom:
            - secretRef:    { name: kirtus-secrets }
            - configMapRef: { name: kirtus-config }
          env:
            - name: FIREBASE_SERVICE_ACCOUNT_PATH
              value: /var/secrets/firebase/firebase-service-account.json
          volumeMounts:
            - name: firebase
              mountPath: /var/secrets/firebase
              readOnly: true
          livenessProbe:
            httpGet: { path: /health, port: 5175 }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            # DB-aware: returns 503 until Mongo answers, so traffic waits.
            httpGet: { path: /api/health, port: 5175 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: firebase
          secret:
            secretName: kirtus-firebase
